<div class="h-full rounded-3xl bg-[#e5f7ee] shadow-sm overflow-hidden flex flex-col">
    <div class="px-4 py-3 border-b border-[#c8e9dc] font-bold text-lg">
        Messages
    </div>

    <div class="flex-1 overflow-y-auto">
        <ul class="flex flex-col">
            @for (chatPartner of chatPartners(); track chatPartner.id) {
                <li>
                    <button 
                        (click)="onSelectPartner(chatPartner)"
                        class="w-full px-4 py-3 flex items-center gap-4 hover:bg-[#d4efe1] transition-colors border-b border-[#c8e9dc]"
                        [ngClass]="{
                            'bg-[#dcead9] border-l-4 border-l-[#2c4c3b]': currentPartnerId() === chatPartner.id,
                            'border-l-transparent': currentPartnerId() !== chatPartner.id
                        }"
                    >
                        <hlm-avatar>
                            <img src="/catProfile2.jpg" alt="profile" hlmAvatarImage />
                        </hlm-avatar>
                        <div class="flex-1 text-left overflow-hidden">
                            <p class="font-semibold truncate">{{ chatPartner.username }}</p>
                            <p class="text-xs truncate text-[#406a54]">Click to view conversation</p>
                        </div>
                    </button>
                </li>
            }
            @if (chatPartners().length === 0) {
                <li class="px-4 py-6 text-center text-sm text-[#406a54]">
                    No partners found.
                </li>
            }
        </ul>
    </div>
</div>
