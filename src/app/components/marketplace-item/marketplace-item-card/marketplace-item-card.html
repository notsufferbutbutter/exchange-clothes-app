<section hlmCard class="px-2 py-2">
    <div class="group h-[250px] overflow-hidden rounded-t-md">
        <img
            [src]="item().images[0]"
            alt="Product image"
            class="h-full w-full object-cover transition-transform duration-300 ease-in-out group-hover:scale-105"
        />
    </div>

    <div hlmCardContent class="items flex flex-col items-center gap-1 py-1">
        <h3 hlmCardTitle>{{ item().title }}</h3>
        <p hlmCardDescription>Condition: {{ item().condition }}</p>
        <p hlmCardDescription>Size: {{ item().size }}</p>
        <p hlmCardDescription>Estimated Price: {{ item().price }} €</p>
        <p hlmCardDescription>Created at: {{ item().createdAt | date: 'mediumDate' }}</p>
    </div>

    <div hlmCardFooter class="flex justify-between pt-0">
        <hlm-avatar>
            <img src="/public/catProfile1.jpg" alt="user profile" hlmAvatarImage />
        </hlm-avatar>

        <button
            (click)="openTradeDialog()"
            class="self-stretch rounded-full 
            flex items-center 
            py-2
            px-4
            border border-black
            hover:bg-accent hover:text-accent-foreground focus:bg-accent focus:text-accent-foreground
            cursor-pointer"
        >
            <div class="text-sm">Tausch anfragen</div>
        </button>

        <div class="flex gap-3">
            <button
                brnToggleGroupItem
                [state]="isItemFavourite() ? 'on' : 'off'"
                (stateChange)="onToggle()"
                size="sm"
                variant="outline"
                aria-label="Toggle heart"
                class="flex items-center data-[state=on]:bg-transparent data-[state=on]:*:[ng-icon]:*:[svg]:fill-red-500 data-[state=on]:*:[ng-icon]:*:[svg]:stroke-red-500"
            >
                <ng-icon name="lucideHeart" size="20" />
            </button> 

            <button hlmBtn size="sm" class="flex items-center justify-center">
                <ng-icon name="lucideMessagesSquare" size="20" />
            </button>
        </div>
    </div>
</section>
