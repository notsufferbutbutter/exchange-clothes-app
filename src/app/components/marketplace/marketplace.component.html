<div class="flex flex-col gap-5 px-10 py-5">
	<h2 class="text-center text-3xl font-bold">MARKETPLACE</h2>

	<hlm-autocomplete
		[filteredOptions]="filteredOption()"
		[(search)]="search"
		searchPlaceholderText="Want to look for something?"
		[transformOptionToString]="transformOption"
		[transformOptionToValue]="transformOption"
		[requireSelection]="false"
	></hlm-autocomplete>

	<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
		@for (item of filteredOption(); track item.id) {
			<app-marketplace-item [item]="item"></app-marketplace-item>
		}
	</div>
</div>
